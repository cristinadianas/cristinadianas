name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Create 3D contribution calendar
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: cristinadianas
          cards: contributions
          output-dir: assets
          themes: light,dark
          palette: green
          commit: false

      - name: Generate language stats from recent changed files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: cristinadianas
        run: python3 scripts/recent_languages.py

      - name: Commit updated visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m 'chore: refresh profile statistics [skip ci]'
            git push
          fi
