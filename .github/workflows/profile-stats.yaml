name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

# Avoid two scheduled runs writing to the profile branch at the same time.
concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Create original 3D contribution calendar
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: cristinadianas
          cards: contributions
          output-dir: assets
          themes: light,dark
          palette: green
          commit: false

      - name: Generate most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cristinadianas
          filename: assets/metrics-languages.svg
          output_action: none
          base: ""
          template: classic
          config_display: large
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: programming, markup, data
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
          commits_authoring: cristinadianas, Cristina-Diana Savin, cristinadianasavin@gmail.com

      - name: Copy most-used languages chart into repository
        run: |
          mkdir -p assets
          sudo cp /metrics_renders/assets/metrics-languages.svg assets/metrics-languages.svg

      # Authored commit history, not GitHub's short-lived events feed.
      - name: Render language panels and update contribution stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: cristinadianas
        run: python3 scripts/profile_activity.py

      - name: Commit refreshed visualizations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m 'chore: refresh GitHub profile visuals [skip ci]'
            git push
          fi
