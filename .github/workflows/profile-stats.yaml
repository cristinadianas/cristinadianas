name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # One SVG with the same two sections as the language screenshot:
      # in-depth authored-code breakdown + languages from recent push events.
      - name: Generate green language breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cristinadianas
          filename: assets/metrics-languages.svg
          base: ""
          template: classic
          config_display: large
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_categories: programming, markup, data
          plugin_languages_recent_categories: programming, markup, data
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 30
          plugin_languages_analysis_timeout: 30
          commits_authoring: cristinadianas, Cristina-Diana Savin, cristinadianasavin@gmail.com
          plugin_languages_colors: "0:#10B981,1:#84CC16,2:#34D399,3:#38BDF8,4:#FBBF24,5:#A3E635,6:#5EEAD4,7:#A7F3D0"
          extras_css: |
            html, body { background: #0B1712 !important; color: #DDFBEA !important; }
            body * { border-color: #244A36 !important; }
            h1, h2, h3, h4, a, .title { color: #6EE7B7 !important; }
            .field, .metadata, small, .muted { color: #A4D5B8 !important; }

      # This is the isometric contributions plugin.
      # Its built-in statistics include 'highest in a day' and average per day.
      - name: Generate green isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cristinadianas
          filename: assets/metrics-contributions.svg
          base: ""
          template: classic
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            html, body { background: #0B1712 !important; color: #DDFBEA !important; }
            body * { border-color: #244A36 !important; }
            h1, h2, h3, h4, a, .title { color: #6EE7B7 !important; }
            .field, .metadata, small, .muted { color: #A4D5B8 !important; }
